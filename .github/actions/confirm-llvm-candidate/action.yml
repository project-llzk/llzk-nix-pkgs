name: Confirm LLVM update candidate
description: Check that an event still refers to the trusted, buildable LLVM update PR.

inputs:
  branch:
    description: Trusted candidate branch expected on the pull request.
    required: false
    default: bot/bump-llvm
  token:
    required: true
  pr-number:
    required: true
  event-sha:
    required: true

outputs:
  eligible:
    description: Whether the candidate should be built.
    value: ${{ steps.confirm.outputs.eligible }}

runs:
  using: composite
  steps:
    - id: confirm
      shell: bash
      env:
        CANDIDATE_BRANCH: ${{ inputs.branch }}
        GH_TOKEN: ${{ inputs.token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        EVENT_SHA: ${{ inputs.event-sha }}
      run: |
        set -euo pipefail
        current_head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')
        current_repo=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.repo.full_name')
        current_ref=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.ref')
        if [[ $current_head != "$EVENT_SHA" || $current_repo != "$GITHUB_REPOSITORY" || $current_ref != "$CANDIDATE_BRANCH" ]]; then
          echo 'Candidate was superseded before this build started.'
          echo 'eligible=false' >> "$GITHUB_OUTPUT"
          exit 0
        fi
        head_subject=$(gh api "repos/$GITHUB_REPOSITORY/commits/$current_head" --jq '.commit.message | split("\\n")[0]')
        if [[ $head_subject == 'chore: trigger CI after Cachix build' ]]; then
          echo 'The current commit only triggers cached CI.'
          echo 'eligible=false' >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo 'eligible=true' >> "$GITHUB_OUTPUT"

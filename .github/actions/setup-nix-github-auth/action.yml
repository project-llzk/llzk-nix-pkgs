name: Set up Nix and GitHub authentication
description: Install the pinned Nix version and make private GitHub inputs available to Nix.

inputs:
  github-access-token:
    description: Token used by Nix while fetching GitHub inputs.
    required: true

runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@v31
      with:
        install_url: https://releases.nixos.org/nix/nix-2.35.2/install
        github_access_token: ${{ inputs.github-access-token }}
    - shell: bash
      run: |
        git config --global 'url.https://api@github.com/'.insteadOf 'https://github.com/'
        git config --global 'url.https://ssh@github.com/'.insteadOf 'ssh://git@github.com/'
        git config --global 'url.https://git@github.com/'.insteadOf 'git@github.com:'

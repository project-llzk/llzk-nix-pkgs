name: Build LLVM update candidate

# This workflow deliberately uses pull_request_target so its definition comes
# from main, not from the candidate branch.  It only executes a branch that is
# owned and updated by the trusted update automation; see README.md for the
# required ruleset.
on:
  pull_request_target:
    branches: [main]
    paths: [flake.lock]
    types: [opened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: build-llvm-update-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    # A fork cannot satisfy head.repo.full_name.  The bot branch is protected
    # so its contents are produced only by Detect LLVM update.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'bot/bump-llvm' &&
      github.actor == 'nix-pkgs-llvm-update-bot[bot]'
    runs-on: [self-hosted, linux, x64, llzk-llvm-builder]
    environment: llvm-cache-publisher
    timeout-minutes: 720
    outputs:
      candidate-eligible: ${{ steps.candidate.outputs.eligible }}
    steps:
      - name: Confirm this is the current trusted candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          current_head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')
          current_repo=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.repo.full_name')
          current_ref=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.ref')

          if [[ $current_head != "$EVENT_SHA" || $current_repo != "$GITHUB_REPOSITORY" || $current_ref != "bot/bump-llvm" ]]; then
            echo "Candidate was superseded before this build started."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The cached-CI trigger is an empty commit after a successful upload.
          # Do not turn that commit into a second expensive build.
          head_subject=$(gh api "repos/$GITHUB_REPOSITORY/commits/$current_head" --jq '.commit.message | split("\\n")[0]')
          if [[ $head_subject == "chore: trigger CI after Cachix build" ]]; then
            echo "The current commit only triggers cached CI."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "eligible=true" >> "$GITHUB_OUTPUT"

      - name: Check out candidate
        if: steps.candidate.outputs.eligible == 'true'
        uses: actions/checkout@v6
        with:
          ref: bot/bump-llvm
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out candidate
        if: steps.candidate.outputs.eligible == 'true'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          [[ $(git rev-parse HEAD) == "$EVENT_SHA" ]]
          changed_paths=$(git diff --name-only "origin/$BASE_REF...HEAD")
          [[ $changed_paths == "flake.lock" ]]

      - name: Install Nix
        if: steps.candidate.outputs.eligible == 'true'
        uses: cachix/install-nix-action@v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.2/install
          github_access_token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Set Git credentials for Nix inputs
        if: steps.candidate.outputs.eligible == 'true'
        run: |
          git config --global 'url.https://api@github.com/'.insteadOf 'https://github.com/'
          git config --global 'url.https://ssh@github.com/'.insteadOf 'ssh://git@github.com/'
          git config --global 'url.https://git@github.com/'.insteadOf 'git@github.com:'

      - name: Configure Cachix publishing
        if: steps.candidate.outputs.eligible == 'true'
        uses: cachix/cachix-action@v17
        with:
          name: veridise-public
          authToken: "${{ secrets.CACHIX_PUBLIC_TOKEN }}"

      - name: Build and publish
        if: steps.candidate.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/build-and-push-cachix --no-trigger-ci

  # Keep the GitHub App key outside the privileged, long-running build job.
  # This job does not execute candidate code before it validates the PR head.
  trigger-cached-ci:
    needs: build-and-publish
    if: >-
      needs.build-and-publish.result == 'success' &&
      needs.build-and-publish.outputs.candidate-eligible == 'true'
    runs-on: ubuntu-24.04
    environment: llvm-update-automation
    permissions:
      contents: read
    steps:
      # Installation tokens expire after one hour. Creating this token only
      # after the long build keeps it valid for the branch update below.
      - name: Create LLVM update bot token for cached CI
        id: ci-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.NIX_PKGS_LLVM_UPDATE_APP_ID }}
          private-key: ${{ secrets.NIX_PKGS_LLVM_UPDATE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read
          permission-issues: write

      - name: Check out current candidate with bot credentials
        uses: actions/checkout@v6
        with:
          token: ${{ steps.ci-token.outputs.token }}
          ref: bot/bump-llvm
          fetch-depth: 0

      - name: Trigger cached CI
        env:
          GH_TOKEN: ${{ steps.ci-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          current_head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')
          if [[ $current_head != "$EVENT_SHA" || $(git rev-parse HEAD) != "$EVENT_SHA" ]]; then
            echo "Candidate was superseded while it was building; cached CI will run for the newer candidate."
            exit 0
          fi

          bot_id=$(gh api "/users/nix-pkgs-llvm-update-bot[bot]" --jq '.id')
          git config user.name "nix-pkgs-llvm-update-bot[bot]"
          git config user.email "$bot_id+nix-pkgs-llvm-update-bot[bot]@users.noreply.github.com"
          git commit --allow-empty --only -m "chore: trigger CI after Cachix build"
          git push origin HEAD:bot/bump-llvm

          if ! gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "✅ All LLVM variants passed and were uploaded to Cachix; pushed an empty commit to trigger cached CI."; then
            echo "WARNING: cached-CI status comment could not be posted." >&2
          fi
